name: HambaLang CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check hambalang tests

      - name: Unit & differential tests (interpreter vs HambaVM)
        run: pytest -q

      - name: Syntax-check all programs
        run: hambalang check examples/*.hl ctf/*.hl

      - name: Run examples on both engines
        run: |
          hambalang run examples/full_demo.hl --fast --seed 1
          hambalang run examples/algorithms.hl --vm --fast --seed 1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build
